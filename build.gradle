plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
}

// Change the values below this to your mods values
// To change the project name, edit the settings.gradle file

project.ext.modID = "xeraphire.autominer" // The unique id of your mod. Must be all lowercase and cannot use special characters.
project.ext.modName = "Autominer Fix" // The display name of your mod.
project.ext.modVersion = "1.0.1" // Your current builds version. Must follow the xx.xx... format.
project.ext.gameVersion = "1.3.2" // The target game version.
project.ext.modDescription = "Automatic mining of ores, gems, and mob materials for Necesse 1.3.2+ with in-game configuration." // Short description of what your mod is.
project.ext.author = "Xeraphire" // Your name

/**
 * When setting clientside to true, it means servers do not need this mod for clients to connect and vice versa.
 * IMPORTANT: If you set this to true, make sure that your mod does not add any content or do anything
 * that could cause clients and servers to desync. This includes registering any items, objects, tiles, packets etc.
 */
project.ext.clientside = false

/**
 * The other mod dependencies of this mod
 * Dependencies define the default load order of mods
 * Uncomment and configure these if your mod has dependencies
 */
//project.ext.modDependencies = ["other.modid1", "other.modid2"]
project.ext.modOptionalDependencies = ["aizsave.customsettingslib"]

// The path to the games install directory (supports both macOS and Windows)
def defaultGameDirectory = System.getProperty("os.name").toLowerCase().contains("mac") ?
        System.getProperty("user.home") + "/Library/Application Support/Steam/steamapps/common/Necesse/Necesse.app/Contents/Resources" :
        "C:/Program Files (x86)/Steam/steamapps/common/Necesse"

def gameDirectory = project.findProperty("gameDirectory") ?: defaultGameDirectory

// =================================================
// ========== DO NOT EDIT BELOW THIS LINE ==========
// =================================================

// Name of the jar
def jarName = "${project.ext.modName.replace(" ", "")}-${project.ext.gameVersion}-${project.ext.modVersion}"

group project.ext.modID
version project.ext.modVersion

setSourceCompatibility(JavaVersion.VERSION_17)
setTargetCompatibility(JavaVersion.VERSION_17)

repositories {
    mavenCentral()
}

configurations {
    libDepends
}

sourceSets.main.resources.destinationDirectory.set(file("build/mod/resources/"))
sourceSets.main.java.destinationDirectory.set(file("build/mod/"))
sourceSets.main.compileClasspath += configurations.libDepends // Adds libDepends configuration to classpath
def buildLocation = "build/jar/"

compileJava.options.encoding = "UTF-8"
tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

if (!file(gameDirectory + "/Necesse.jar").exists()) {
    throw new Exception("Could not find game install directory at " + gameDirectory + ". Make sure it is correct in build.gradle file.")
}

dependencies {
    implementation files(gameDirectory + "/Necesse.jar")
    implementation fileTree(gameDirectory + "/lib/")
    implementation fileTree("./mods/") // Add all mods located in local mods folder
    compileOnly fileTree(dir: System.getProperty("user.home") + "/Library/Application Support/Necesse/mods", include: "CustomSettingsLib*.jar")
    compileOnly fileTree(dir: "../CustomSettingsLib/build/jar", include: "CustomSettingsLib*.jar")

    // Add any third party library dependencies here. Remember to use libDepends, so that they will be added to your jar on build
    // These are some items:
//    libDepends group: 'com.google.guava', name: 'guava', version: '31.1-jre'
//    libDepends files("path/to/library/jar.jar")
}

task createAppID {
    group "necesse"
    description "Creates steam_appid.txt file"

    doLast {
        file("steam_appid.txt").text = "1169040"
    }
}

task createModInfoFile {
    group "necesse"
    description "Creates the mod info file"

    def modInfoFile = file("${layout.buildDirectory.get()}/mod/mod.info")

    doLast {
        modInfoFile.parentFile.mkdirs()

        def escape = { String str ->
            str.replace("\\", "\\\\").replace(",", "\\,").replace("}", "\\}").replace("{", "\\{")
        }

        def content = new StringBuilder()
        content.append("{\n")
        content.append("\tid = ${project.ext.modID},\n")
        content.append("\tname = ${escape(project.ext.modName)},\n")
        content.append("\tversion = ${project.ext.modVersion},\n")
        content.append("\tgameVersion = ${project.ext.gameVersion},\n")
        content.append("\tauthor = ${escape(project.ext.author)},\n")
        content.append("\tdescription = ${escape(project.ext.modDescription)},\n")
        content.append("\tclientside = ${project.ext.clientside}")
        if (project.ext.has("modDependencies") && project.ext.modDependencies) {
            content.append(",\n\tdependencies = [${project.ext.modDependencies.join(', ')}]")
        }
        if (project.ext.has("modOptionalDependencies") && project.ext.modOptionalDependencies) {
            content.append(",\n\toptionalDependencies = [${project.ext.modOptionalDependencies.join(', ')}]")
        }
        content.append("\n}\n")

        modInfoFile.text = content.toString()
        println "Created mod info file at ${modInfoFile.absolutePath}"
    }
}
// Makes compiling also create mod info file
classes.dependsOn("createModInfoFile")

task runClient(type: JavaExec) {
    group "necesse"
    description "Run client with current mod"
    dependsOn "buildModJar", "createAppID"

    classpath = files(gameDirectory + "/Necesse.jar")

    mainClass = "StartSteamClient"
    jvmArgs "-Xms512m", "-Xmx4G", "-XX:+UnlockExperimentalVMOptions", "-XX:+UseG1GC", "-XX:G1NewSizePercent=20", "-XX:G1ReservePercent=20", "-XX:MaxGCPauseMillis=50", "-XX:G1HeapRegionSize=32M"
    args "-dev", "-mod \"${buildLocation}\""
}

task runDevClient(type: JavaExec) {
    group "necesse"
    description "Run client with current mod"
    dependsOn "buildModJar", "createAppID"

    classpath = files(gameDirectory + "/Necesse.jar")

    mainClass = "StartSteamClient"
    jvmArgs "-Xms512m", "-Xmx4G", "-XX:+UnlockExperimentalVMOptions", "-XX:+UseG1GC", "-XX:G1NewSizePercent=20", "-XX:G1ReservePercent=20", "-XX:MaxGCPauseMillis=50", "-XX:G1HeapRegionSize=32M"
    args "-dev 1", "-mod \"${buildLocation}\""
}

task runServer(type: JavaExec) {
    group "necesse"
    description "Run server with current mod"
    dependsOn "buildModJar"

    classpath = files(gameDirectory + "/Server.jar")

    mainClass = "StartDesktopServer"
    jvmArgs "-Xms512m", "-Xmx4G", "-XX:+UnlockExperimentalVMOptions", "-XX:+UseG1GC", "-XX:G1NewSizePercent=20", "-XX:G1ReservePercent=20", "-XX:MaxGCPauseMillis=50", "-XX:G1HeapRegionSize=32M"
    args "-mod \"${buildLocation}\""
}

task buildModJar(type: Jar) {
    group "necesse"
    description "Generates the mod jar into the build folder"
    dependsOn "classes"

    doFirst {
        fileTree(dir: buildLocation).exclude("${jarName}.jar", "preview.png").each { delete it }
    }

    // Add mod output
    from "build/mod/"
    // Add resources
    from("src/main/resources") {
        into "resources"
    }
    // Add the dependencies
    from configurations.libDepends.collect { it.isDirectory() ? it : zipTree(it) }

    archiveFileName = "${jarName}.jar"
    destinationDirectory = file(buildLocation)

    doLast {
        if (file("src/main/resources/preview.png").exists()) {
            copy {
                from "src/main/resources/preview.png"
                into buildLocation
            }
        }
    }
}

task copyMod(type: Copy) {
    group "necesse"
    description "Copies the compiled mod jar to the game's mods folder"
    dependsOn "buildModJar"

    def userHome = System.getProperty("user.home")
    def modsDir = System.getProperty("os.name").toLowerCase().contains("mac") ?
            file("${userHome}/Library/Application Support/Necesse/mods") :
            file("${userHome}/AppData/Roaming/Necesse/mods")

    doFirst {
        if (!modsDir.exists()) {
            modsDir.mkdirs()
        }
        fileTree(dir: modsDir, include: "AutoMiner*.jar").each { delete it }
        fileTree(dir: modsDir, include: "Autominer*.jar").each { delete it }
        def dsStore = new File(modsDir, ".DS_Store")
        if (dsStore.exists()) {
            dsStore.delete()
        }
    }

    from buildLocation
    into modsDir
    include "${jarName}.jar"

    doLast {
        println "Successfully copied ${jarName}.jar to ${modsDir}"
    }
}

